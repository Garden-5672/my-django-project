<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>닉네임 설정</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f3f4f6; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .error { color: #ef4444; font-size: 0.85rem; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎉 환영합니다!</h2>
    <p style="color: #6b7280; font-size: 0.9rem;">서비스에서 사용할 닉네임을 입력해 주세요.</p>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="nickname" placeholder="닉네임 (예: 멋진개발자)" required maxlength="20">
        <button type="submit">시작하기</button>
    </form>
</div>

</body>
</html>
