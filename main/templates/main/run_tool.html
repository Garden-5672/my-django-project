<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tool.name }} - 사용 안내</title>
    <style>
        /* ==========================================================================
           Design System: Pink Minimalist Emblem Theme
           ========================================================================== */
        :root {
            --bg-primary: #fff5f7;        /* 은은한 피치 핑크 배경 */
            --bg-surface: #ffffff;        /* 순백색 카드 배경 */
            --bg-subtle: #fce8ed;         /* 연핑크 호버/강조 영역 */
            
            --text-main: #2b1b22;         /* 다크 핑크/버건디 톤 어두운 텍스트 */
            --text-sub: #8a6d7b;          /* 소프트 로즈 브라운 텍스트 */
            --border-color: #f7d4dc;      /* 연한 핑크 테두리선 */

            /* Point Colors (Pink Palette) */
            --primary-pink: #e85d88;      /* 체리 블라썸 핑크 (메인 버튼/포인트) */
            --accent-rose: #c84168;       /* 딥 로즈 핑크 (강조/테두리) */
            --soft-pink: #fdf0f3;         /* 연한 핑크 배지 */

            --shadow-sm: 0 2px 8px rgba(232, 93, 136, 0.08);
            --shadow-md: 0 4px 16px rgba(232, 93, 136, 0.15);
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1215;
                --bg-surface: #261a20;
                --bg-subtle: #38242f;
                --text-main: #fde8ed;
                --text-sub: #c4a3b1;
                --border-color: #402835;
                --primary-pink: #f0789d;
                --accent-rose: #f48fb1;
                --soft-pink: #331f29;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 16px rgba(240, 120, 157, 0.15);
            }
        }

        body.dark-mode {
            --bg-primary: #1a1215;
            --bg-surface: #261a20;
            --bg-subtle: #38242f;
            --text-main: #fde8ed;
            --text-sub: #c4a3b1;
            --border-color: #402835;
            --primary-pink: #f0789d;
            --accent-rose: #f48fb1;
            --soft-pink: #331f29;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(240, 120, 157, 0.15);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; 
            max-width: 800px; 
            margin: 30px auto; 
            padding: 0 20px; 
            color: var(--text-main); 
            background-color: var(--bg-primary);
            line-height: 1.6; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Bar & Emblem Header */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-emblem {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--text-main);
        }

        .emblem-icon {
            width: 28px;
            height: 28px;
            stroke: var(--primary-pink);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .back-link { 
            display: inline-block; 
            color: var(--text-sub); 
            text-decoration: none; 
            font-size: 0.9rem; 
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--primary-pink); }

        .header-container { margin-bottom: 20px; }
        .header-title { font-size: 1.6rem; margin: 0 0 6px 0; color: var(--text-main); }
        .header-sub { color: var(--text-sub); font-size: 0.95rem; margin: 0; }

        /* 카드 컨테이너 스타일 */
        .card-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        /* 인증 키 강조 박스 */
        .secret-box {
            background: var(--bg-subtle);
            border-left: 4px solid var(--accent-rose);
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }

        .notice-text {
            color: var(--accent-rose);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .code-badge {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent-rose);
            display: inline-block;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* 메인 버튼 */
        .btn-primary { 
            display: inline-block;
            width: 100%; 
            padding: 14px; 
            background: var(--primary-pink); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.05rem; 
            font-weight: bold;
            cursor: pointer; 
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover { opacity: 0.92; }

        /* 탭 스타일 */
        .tab-container {
            margin-top: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--primary-pink);
            border-bottom-color: var(--primary-pink);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Step List (탭 2 상세용) */
        .step-list {
            padding-left: 0;
            list-style: none;
            margin: 0;
        }

        .step-item {
            background: var(--bg-subtle);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary-pink);
        }

        .step-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .step-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin: 0 0 8px 0;
            line-height: 1.5;
        }

        .info-card {
            background: var(--bg-subtle);
            border-radius: 8px;
            padding: 18px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- 상단 내비게이션 바 -->
    <div class="top-navbar">
        <div class="logo-emblem">
            <svg class="emblem-icon" viewBox="0 0 24 24">
                <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                <path d="M13 19l2 2 2-2-2-2z" />
                <circle cx="18" cy="6" r="2" />
                <path d="M18 2a4 4 0 0 0-4 4c0 2 4 6 4 6s4-4 4-6a4 4 0 0 0-4-4z" />
                <path d="M6 15c-1 0-2 1-2 2s1 2 2 2h4" />
            </svg>
            <span>LEO TOOLBOX</span>
        </div>
        <a href="{% url 'index' %}" class="back-link">← 메인 목록으로 돌아가기</a>
    </div>

    <!-- 헤더 영역 -->
    <div class="header-container">
        <h1 class="header-title">{{ tool.icon }} {{ tool.name }}</h1>
        <p class="header-sub">{{ tool.description }}</p>
    </div>

        <!-- 실행 버튼 -->
        {% if tool.tool_link %}
            <a href="{{ tool.tool_link }}" target="_blank" class="btn-primary">
                🚀 {{ tool.name }} 대시보드 실행하기 (새 창)
            </a>
        {% else %}
            <p style="color: var(--accent-rose); font-size: 0.9rem; margin: 0;">등록된 도구 링크가 없습니다. Admin에서 추가해 주세요.</p>
        {% endif %}
    </div>

    <!-- 하단 돌아가기 -->
    <div style="margin-top: 24px; text-align: center;">
        <a href="{% url 'index' %}" class="back-link">← 메인 목록으로 돌아가기</a>
    </div>

    <!-- 탭 전환 스크립트 -->
    <script>
        function switchTab(tabId, element) {
            // 모든 탭 버튼 및 컨텐츠 비활성화
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // 선택한 탭 활성화
            element.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
