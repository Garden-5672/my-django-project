<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈니스 가치 체계 설계기</title>
    <!-- SheetJS 라이브러리 (엑셀 다운로드용) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #fff5f7;
            --bg-surface: #ffffff;
            --bg-subtle: #fce8ed;
            --text-main: #2b1b22;
            --text-sub: #8a6d7b;
            --border-color: #f7d4dc;
            --primary-pink: #e85d88;
            --accent-rose: #c84168;
            --radius: 12px;
            --shadow-sm: 0 2px 8px rgba(232, 93, 136, 0.08);
            --shadow-md: 0 4px 16px rgba(232, 93, 136, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 20px;
            line-height: 1.6;
        }

        .header-box {
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        /* 💡 1단계~4단계 세로(위아래) 스택 레이아웃 */
        .step-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .step-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-pink);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .step-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-rose);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        /* 💡 입력 상자를 크고 시원하게 확대 */
        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background: #fafafa;
        }

        /* 여러 줄 입력이 가능하도록 textarea로 처리 */
        textarea.input-field {
            height: 70px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: var(--primary-pink);
            color: #fff;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        .btn-sub {
            background: var(--bg-surface);
            color: var(--primary-pink);
            border: 1px solid var(--primary-pink);
            margin-top: 8px;
        }

        /* 💡 시각화 출력 영역 (위에서 아래로 흘러가는 가치 사다리) */
        #visual-section {
            display: none;
            margin-top: 32px;
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .visual-ladder {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
            position: relative;
        }

        .visual-step-node {
            background: var(--bg-primary);
            border: 2px solid var(--primary-pink);
            border-radius: var(--radius);
            padding: 16px 20px;
            position: relative;
        }

        .visual-arrow {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-pink);
            margin: -8px 0;
        }

        .export-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1 style="margin:0 0 8px 0;">🪜 비즈니스 가치 체계 설계기</h1>
        <p style="margin:0; color: var(--text-sub);">고객의 신뢰도에 맞춰 1단계부터 4단계까지 가치를 확장하는 사다리를 설계하세요.</p>
        <button class="btn btn-sub" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin-top: 12px;" onclick="loadLeoExample()">
            🪄 LEO TOOLBOX 예시 불러오기
        </button>
    </div>

    <!-- 입력 폼 (1단계 ~ 4단계 세로 스택) -->
    <form id="valueForm">
        <div class="step-stack">
            
            <!-- 1단계 -->
            <div class="step-card">
                <div class="step-title">1단계: 무료 제안 (Lead Magnet)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s1_name" class="input-field" placeholder="예: 레오의 툴박스 도구 1개 무료 체험">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s1_price" class="input-field" placeholder="예: 0원">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s1_value" class="input-field" placeholder="예: 가입 즉시 핵심 기능 1개를 직접 사용해 보며 문제 해결 경험 제공"></textarea>
                </div>
            </div>

            <!-- 2단계 -->
            <div class="step-card">
                <div class="step-title">2단계: 진입 상품 (Tripwire)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s2_name" class="input-field" placeholder="예: 개별 마이크로 도구 평생 해금">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s2_price" class="input-field" placeholder="예: 1,000원">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s2_value" class="input-field" placeholder="예: 커피 한 잔 값으로 단일 업무의 시간을 90% 단축"></textarea>
                </div>
            </div>

            <!-- 3단계 -->
            <div class="step-card">
                <div class="step-title">3단계: 핵심 서비스 (Core Offer)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s3_name" class="input-field" placeholder="예: LEO TOOLBOX 멤버십 (ALL 패키지)">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s3_price" class="input-field" placeholder="예: 월 29,900원">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s3_value" class="input-field" placeholder="예: 모든 비즈니스 도구 무제한 이용 및 신규 도구 지속 업데이트"></textarea>
                </div>
            </div>

            <!-- 4단계 -->
            <div class="step-card">
                <div class="step-title">4단계: 하이엔드 (High-End Offer)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s4_name" class="input-field" placeholder="예: 1:1 맞춤형 웹 도구/시스템 구축 개발">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s4_price" class="input-field" placeholder="예: 1,500,000원부터">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s4_value" class="input-field" placeholder="예: 고객사 비즈니스 프로세스에 최적화된 맞춤형 파이썬/장고 플랫폼 연동"></textarea>
                </div>
            </div>

        </div>

        <button type="button" class="btn" onclick="renderVisualization()">✨ 가치 체계 시각화하기</button>
    </form>

    <!-- 시각화 결과 영역 -->
    <div id="visual-section">
        <h2 style="margin-top:0;">📊 완성된 비즈니스 가치 사다리</h2>
        <div id="ladder-container" class="visual-ladder"></div>

        <!-- 내보내기 버튼 그룹 -->
        <div class="export-btn-group">
            <button class="btn btn-sub" onclick="downloadExcel()">📊 엑셀(.xlsx) 다운로드</button>
            <button class="btn btn-sub" onclick="copyForGoogleSheets()">📋 구글 시트용 복사</button>
        </div>
    </div>

    <script>
    // LEO TOOLBOX 예시 데이터 불러오기
    function loadLeoExample() {
        document.getElementById('s1_name').value = "레오의 툴박스 도구 1개 무료 체험";
        document.getElementById('s1_price').value = "0원";
        document.getElementById('s1_value').value = "가입 즉시 핵심 기능 1개를 직접 사용해 보며 문제 해결 경험 제공";

        document.getElementById('s2_name').value = "개별 마이크로 도구 평생 해금";
        document.getElementById('s2_price').value = "1,000원";
        document.getElementById('s2_value').value = "커피 한 잔 값으로 단일 업무의 시간을 90% 단축";

        document.getElementById('s3_name').value = "LEO TOOLBOX 멤버십 (ALL 패키지)";
        document.getElementById('s3_price').value = "월 29,900원";
        document.getElementById('s3_value').value = "모든 비즈니스 도구 무제한 이용 및 신규 도구 지속 업데이트";

        document.getElementById('s4_name').value = "1:1 맞춤형 웹 도구/시스템 구축 개발";
        document.getElementById('s4_price').value = "1,500,000원부터";
        document.getElementById('s4_value').value = "고객사 비즈니스 프로세스에 최적화된 맞춤형 파이썬/장고 플랫폼 연동";
    }

    // 시각화 렌더링 (위에서 아래로 세로 출력)
    function renderVisualization() {
        const container = document.getElementById('ladder-container');
        container.innerHTML = '';

        const steps = [
            { step: '1단계: 무료 제안', name: document.getElementById('s1_name').value, price: document.getElementById('s1_price').value, value: document.getElementById('s1_value').value },
            { step: '2단계: 진입 상품', name: document.getElementById('s2_name').value, price: document.getElementById('s2_price').value, value: document.getElementById('s2_value').value },
            { step: '3단계: 핵심 서비스', name: document.getElementById('s3_name').value, price: document.getElementById('s3_price').value, value: document.getElementById('s3_value').value },
            { step: '4단계: 하이엔드', name: document.getElementById('s4_name').value, price: document.getElementById('s4_price').value, value: document.getElementById('s4_value').value }
        ];

        steps.forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'visual-step-node';
            node.innerHTML = `
                <div style="font-weight:bold; color:var(--accent-rose); font-size:0.9rem;">${item.step}</div>
                <div style="font-size:1.1rem; font-weight:bold; margin:4px 0;">${item.name || '(미입력)'} <span style="font-size:0.9rem; color:var(--primary-pink);">[${item.price || '0원'}]</span></div>
                <div style="color:var(--text-sub); font-size:0.95rem;">${item.value || '(제공 가치 미입력)'}</div>
            `;
            container.appendChild(node);

            // 단계 사이 화살표 추가
            if (index < steps.length - 1) {
                const arrow = document.createElement('div');
                arrow.className = 'visual-arrow';
                arrow.innerText = '⬇️';
                container.appendChild(arrow);
            }
        });

        document.getElementById('visual-section').style.display = 'block';
        document.getElementById('visual-section').scrollIntoView({ behavior: 'smooth' });
    }

    // 데이터 가져오기 공통 함수
    function getFormData() {
        return [
            ["단계", "상품명", "가격", "제공 가치"],
            ["1단계 (무료 제안)", document.getElementById('s1_name').value, document.getElementById('s1_price').value, document.getElementById('s1_value').value],
            ["2단계 (진입 상품)", document.getElementById('s2_name').value, document.getElementById('s2_price').value, document.getElementById('s2_value').value],
            ["3단계 (핵심 서비스)", document.getElementById('s3_name').value, document.getElementById('s3_price').value, document.getElementById('s3_value').value],
            ["4단계 (하이엔드)", document.getElementById('s4_name').value, document.getElementById('s4_price').value, document.getElementById('s4_value').value]
        ];
    }

    // 1. 엑셀(.xlsx) 파일 다운로드
    function downloadExcel() {
        const data = getFormData();
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "가치체계설계");
        XLSX.writeFile(wb, "비즈니스_가치_체계_설계서.xlsx");
    }

    // 2. 구글 시트 붙여넣기용 클립보드 복사 (TSV 포맷)
    function copyForGoogleSheets() {
        const data = getFormData();
        const tsvContent = data.map(row => row.join("\t")).join("\n");
        
        navigator.clipboard.writeText(tsvContent).then(() => {
            alert("구글 시트에 바로 붙여넣기(Ctrl+V)할 수 있도록 클립보드에 복사되었습니다!");
        }).catch(err => {
            alert("복사 실패: " + err);
        });
    }
    </script>
</body>
</html>
