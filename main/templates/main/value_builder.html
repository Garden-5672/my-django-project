<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈니스 가치 체계 설계기</title>
    <!-- SheetJS 라이브러리 (엑셀 다운로드용) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #fff5f7;
            --bg-surface: #ffffff;
            --bg-subtle: #fce8ed;
            --text-main: #2b1b22;
            --text-sub: #8a6d7b;
            --border-color: #f7d4dc;
            --primary-pink: #e85d88;
            --accent-rose: #c84168;
            --radius: 12px;
            --shadow-sm: 0 2px 8px rgba(232, 93, 136, 0.08);
            --shadow-md: 0 4px 16px rgba(232, 93, 136, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 20px;
            line-height: 1.6;
        }

        .header-box {
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .step-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-pink);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .step-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-rose);
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background: #fafafa;
        }

        textarea.input-field {
            height: 70px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: var(--primary-pink);
            color: #fff;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn:hover { opacity: 0.9; }

        .btn-sub {
            background: var(--bg-surface);
            color: var(--primary-pink);
            border: 1px solid var(--primary-pink);
        }

        #visual-section {
            display: none;
            margin-top: 32px;
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .visual-ladder {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .visual-step-node {
            background: var(--bg-primary);
            border: 2px solid var(--primary-pink);
            border-radius: var(--radius);
            padding: 16px 20px;
        }

        .visual-arrow {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-pink);
            margin: -8px 0;
        }

        .export-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <div>
            <h1 style="margin:0 0 8px 0; font-size: 1.5rem;">🪜 비즈니스 가치 체계 설계기</h1>
            <p style="margin:0; color: var(--text-sub); font-size: 0.9rem;">고객의 신뢰도에 맞춰 1단계부터 4단계까지 가치를 확장하는 사다리를 설계하세요.</p>
        </div>
        <a href="javascript:history.back()" class="btn btn-sub" style="width: auto; padding: 8px 14px; font-size: 0.85rem;">← 돌아가기</a>
    </div>

    <!-- 입력 폼 -->
    <form id="valueForm">
        <div class="step-stack">
            
            <!-- 1단계 -->
            <div class="step-card">
                <div class="step-title">1단계: 무료 제안 (Lead Magnet)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s1_name" class="input-field" placeholder="예: 0원 체크리스트 / 핵심 노하우 PDF / 무료 체험권">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s1_price" class="input-field" placeholder="예: 0원">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s1_value" class="input-field" placeholder="예: 진입 장벽 없이 고객의 DB(이메일/연락처)를 확보하고 초기 신뢰 형성"></textarea>
                </div>
            </div>

            <!-- 2단계 -->
            <div class="step-card">
                <div class="step-title">2단계: 진입 상품 (Tripwire)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s2_name" class="input-field" placeholder="예: VOD 강의 / 미니 템플릿 / 마이크로 웹 도구 단건">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s2_price" class="input-field" placeholder="예: 1,000원 ~ 10,000원">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s2_value" class="input-field" placeholder="예: 부담 없는 소액 결제로 무료 유저를 '구매 고객'으로 전환시키는 경험 제공"></textarea>
                </div>
            </div>

            <!-- 3단계 -->
            <div class="step-card">
                <div class="step-title">3단계: 핵심 서비스 (Core Offer)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s3_name" class="input-field" placeholder="예: 정규 패키지 / 월간 구독 서비스 / 시그니처 전자책">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s3_price" class="input-field" placeholder="예: 월 29,900원 / 300,000원">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s3_value" class="input-field" placeholder="예: 비즈니스의 메인 수익을 창출하며, 고객의 핵심 문제를 지속적으로 해결"></textarea>
                </div>
            </div>

            <!-- 4단계 -->
            <div class="step-card">
                <div class="step-title">4단계: 하이엔드 (High-End Offer)</div>
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" id="s4_name" class="input-field" placeholder="예: 1:1 컨설팅 / 맞춤형 웹 구축 / VIP 코칭 패키지">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="s4_price" class="input-field" placeholder="예: 1,500,000원부터">
                </div>
                <div class="form-group">
                    <label>제공 가치</label>
                    <textarea id="s4_value" class="input-field" placeholder="예: 최상위 가치를 원하는 VIP 고객에게 직접적인 성과를 함께 만들어주는 서비스"></textarea>
                </div>
            </div>

        </div>

        <button type="button" class="btn" onclick="renderVisualization()">✨ 가치 체계 시각화하기</button>
    </form>

    <!-- 시각화 결과 영역 -->
    <div id="visual-section">
        <h2 style="margin-top:0;">📊 완성된 비즈니스 가치 사다리</h2>
        <div id="ladder-container" class="visual-ladder"></div>

        <div class="export-btn-group">
            <button class="btn btn-sub" onclick="downloadExcel()">📊 엑셀(.xlsx) 다운로드</button>
            <button class="btn btn-sub" onclick="copyForGoogleSheets()">📋 구글 시트용 복사</button>
        </div>
    </div>

    <script>
    function renderVisualization() {
        const container = document.getElementById('ladder-container');
        container.innerHTML = '';

        const steps = [
            { step: '1단계: 무료 제안', name: document.getElementById('s1_name').value, price: document.getElementById('s1_price').value, value: document.getElementById('s1_value').value },
            { step: '2단계: 진입 상품', name: document.getElementById('s2_name').value, price: document.getElementById('s2_price').value, value: document.getElementById('s2_value').value },
            { step: '3단계: 핵심 서비스', name: document.getElementById('s3_name').value, price: document.getElementById('s3_price').value, value: document.getElementById('s3_value').value },
            { step: '4단계: 하이엔드', name: document.getElementById('s4_name').value, price: document.getElementById('s4_price').value, value: document.getElementById('s4_value').value }
        ];

        steps.forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'visual-step-node';
            node.innerHTML = `
                <div style="font-weight:bold; color:var(--accent-rose); font-size:0.9rem;">${item.step}</div>
                <div style="font-size:1.1rem; font-weight:bold; margin:4px 0;">${item.name || '(미입력)'} <span style="font-size:0.9rem; color:var(--primary-pink);">[${item.price || '0원'}]</span></div>
                <div style="color:var(--text-sub); font-size:0.95rem;">${item.value || '(제공 가치 미입력)'}</div>
            `;
            container.appendChild(node);

            if (index < steps.length - 1) {
                const arrow = document.createElement('div');
                arrow.className = 'visual-arrow';
                arrow.innerText = '⬇️';
                container.appendChild(arrow);
            }
        });

        document.getElementById('visual-section').style.display = 'block';
        document.getElementById('visual-section').scrollIntoView({ behavior: 'smooth' });
    }

    function getFormData() {
        return [
            ["단계", "상품명", "가격", "제공 가치"],
            ["1단계 (무료 제안)", document.getElementById('s1_name').value, document.getElementById('s1_price').value, document.getElementById('s1_value').value],
            ["2단계 (진입 상품)", document.getElementById('s2_name').value, document.getElementById('s2_price').value, document.getElementById('s2_value').value],
            ["3단계 (핵심 서비스)", document.getElementById('s3_name').value, document.getElementById('s3_price').value, document.getElementById('s3_value').value],
            ["4단계 (하이엔드)", document.getElementById('s4_name').value, document.getElementById('s4_price').value, document.getElementById('s4_value').value]
        ];
    }

    function downloadExcel() {
        const data = getFormData();
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "가치체계설계");
        XLSX.writeFile(wb, "비즈니스_가치_체계_설계서.xlsx");
    }

    function copyForGoogleSheets() {
        const data = getFormData();
        const tsvContent = data.map(row => row.join("\t")).join("\n");
        
        navigator.clipboard.writeText(tsvContent).then(() => {
            alert("구글 시트에 바로 붙여넣기(Ctrl+V)할 수 있도록 클립보드에 복사되었습니다!");
        }).catch(err => {
            alert("복사 실패: " + err);
        });
    }
    </script>
</body>
</html>
